[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ResOSc"
version = "0.1.0"
description = "Resonant Oscillator Simulator for Coupled Systems"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "George Issa" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.urls]
Repository = "https://github.com/george-issa/ResOSc"

[tool.setuptools]
packages = ["ResOSc"]
