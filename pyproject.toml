[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ResOSc"
version = "0.1.0"
description = "Resonant Oscillator Simulator for Coupled Systems"
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "George Issa" }]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.urls]
Repository = "https://github.com/george-issa/ResOSc"

[tool.setuptools]
packages = ["ResOSc"]
